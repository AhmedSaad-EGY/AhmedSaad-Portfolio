name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'global.json'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'global.json'
      - '.github/workflows/backend-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - run: dotnet restore backend/Portfolio.slnx
      - run: dotnet build backend/Portfolio.slnx --configuration Release --no-restore
      - run: dotnet test backend/Portfolio.slnx --configuration Release --no-build
